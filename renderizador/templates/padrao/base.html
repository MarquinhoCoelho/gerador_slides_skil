<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Poppins:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ============================================================
   DESIGN TOKENS — injetados pelo Python
   ============================================================ */
:root {
  --fundo-escuro:     {{ FUNDO_ESCURO }};
  --fundo-claro:      {{ FUNDO_CLARO }};
  --surface-card:     {{ SURFACE_CARD }};
  --border-card:      {{ BORDER_CARD }};
  --texto-primario:   {{ TEXTO_PRIMARIO }};
  --texto-secundario: {{ TEXTO_SECUNDARIO }};
  --texto-claro:      {{ TEXTO_CLARO }};
  --accent:           {{ ACCENT }};
  --accent2:          {{ ACCENT2 }};
  --accent-orange:    {{ ACCENT_ORANGE }};
  --badge-bg:         {{ BADGE_BG }};
  --badge-text:       {{ BADGE_TEXT }};
  --fonte-titulo:     {{ FONTE_TITULO }};
  --fonte-corpo:      {{ FONTE_CORPO }};
  --padding-slide:    {{ PADDING_SLIDE }};
  --radius:           {{ BORDER_RADIUS }};
  --radius-lg:        {{ BORDER_RADIUS_LG }};

  --grad-main: linear-gradient(135deg, var(--accent-orange) 0%, var(--accent) 50%, var(--accent2) 100%);
  --grad-line: linear-gradient(90deg, var(--accent-orange), var(--accent), var(--accent2));
}

/* ============================================================ RESET ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  width: 1280px; height: 720px; overflow: hidden;
  font-family: 'Inter', var(--fonte-corpo), 'Segoe UI', sans-serif;
  background: var(--fundo-claro);
  -webkit-font-smoothing: antialiased;
}

.slide { width: 1280px; height: 720px; position: relative; overflow: hidden; display: flex; flex-direction: column; }

/* ============================================================
   COMPONENTES GLOBAIS
   ============================================================ */

/* Branding topo direito — logo img OU texto */
.branding-area {
  position: absolute; top: 20px; right: 52px;
  display: flex; align-items: center; gap: 10px; z-index: 30;
}

.brand-logo { height: 36px; object-fit: contain; }

.brand-txt {
  font-family: 'Poppins', sans-serif; font-size: 13px;
  font-weight: 800; letter-spacing: 1px; color: var(--texto-secundario);
}

.brand-badge {
  background: var(--accent2); color: #fff;
  font-family: 'Poppins', sans-serif; font-size: 11px;
  font-weight: 800; letter-spacing: 1.5px;
  padding: 4px 10px; border-radius: 4px;
}

/* Sobre fundo escuro/gradiente */
.branding-area.claro .brand-txt  { color: rgba(255,255,255,0.7); }
.branding-area.claro .brand-badge { background: rgba(255,255,255,0.18); color: #fff; }

/* Eyebrow */
.eyebrow {
  font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600;
  letter-spacing: 3px; text-transform: uppercase; color: var(--accent);
}

/* Linha gradiente base */
.linha-base {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 5px; background: var(--grad-line);
}

/* Numeração */
.num-slide {
  position: absolute; bottom: 14px; right: 52px;
  font-size: 11px; font-weight: 600; letter-spacing: 1px;
  opacity: 0.35; z-index: 20; font-family: 'Inter', sans-serif;
}

/* Header escuro padrão */
.header-dark {
  background: var(--fundo-escuro); padding: 0 64px; height: 110px;
  display: flex; align-items: center; gap: 18px; flex-shrink: 0;
}

.header-dark h2 {
  font-family: 'Poppins', sans-serif; font-size: 36px; font-weight: 700;
  color: #fff; text-transform: uppercase; letter-spacing: 0.3px;
}

.header-dark .header-icone { width: 52px; height: 52px; object-fit: contain; flex-shrink: 0; }

/* ============================================================
   TIPO: capa
   ============================================================ */
.slide-capa { background: var(--grad-main); justify-content: center; align-items: flex-start; }

.slide-capa .corpo { padding: 0 72px; position: relative; z-index: 2; max-width: 860px; display: flex; flex-direction: column; gap: 20px; }

.slide-capa .eyebrow { color: rgba(255,255,255,0.75); letter-spacing: 2.5px; }

.slide-capa h1 {
  font-family: 'Poppins', sans-serif; font-size: 68px; font-weight: 900;
  color: #fff; line-height: 1.0; letter-spacing: -1.5px;
  text-transform: uppercase; text-shadow: 0 3px 24px rgba(0,0,0,0.22);
}

.slide-capa .subtitulo { font-size: 24px; color: rgba(255,255,255,0.85); font-weight: 400; line-height: 1.45; max-width: 680px; }

.slide-capa .num-slide { color: rgba(255,255,255,0.4); }

/* ============================================================
   TIPO: bullets
   ============================================================ */
.slide-bullets { background: #fff; }

.slide-bullets .corpo { padding: 28px 64px 56px; flex: 1; display: flex; flex-direction: column; gap: 13px; }

.slide-bullets .bullet {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 14px 22px; background: #F8FAFC;
  border: 1px solid #E2E8F0; border-radius: var(--radius);
  border-left: 4px solid var(--accent);
}

.slide-bullets .bullet-num {
  min-width: 28px; height: 28px; border-radius: 50%;
  background: var(--accent); color: #fff;
  font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 3px;
}

.slide-bullets .bullet-texto { font-size: 23px; color: var(--texto-primario); line-height: 1.35; font-weight: 400; }
.slide-bullets .bullet-texto strong { font-weight: 700; color: var(--accent); }
.slide-bullets .num-slide { color: var(--texto-secundario); }

/* ============================================================
   TIPO: cards
   ============================================================ */
.slide-cards { background: #fff; }

.slide-cards .grid { padding: 24px 52px 56px; flex: 1; display: grid; gap: 18px; align-items: stretch; }
.slide-cards .grid.cols-2 { grid-template-columns: repeat(2,1fr); }
.slide-cards .grid.cols-3 { grid-template-columns: repeat(3,1fr); }
.slide-cards .grid.cols-4 { grid-template-columns: repeat(4,1fr); }

.slide-cards .card-item {
  background: #F8FAFC; border: 1px solid #E2E8F0;
  border-radius: var(--radius); padding: 22px 20px 18px;
  display: flex; flex-direction: column; gap: 10px;
  position: relative; overflow: hidden;
}

.slide-cards .card-item::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--grad-line); }

.slide-cards .card-num { width: 34px; height: 34px; border-radius: 8px; background: var(--badge-bg); color: var(--badge-text); font-size: 15px; font-weight: 800; font-family: 'Poppins', sans-serif; display: flex; align-items: center; justify-content: center; }

.slide-cards .card-icone { width: 40px; height: 40px; object-fit: contain; }

.slide-cards .card-titulo { font-size: 18px; font-weight: 700; color: var(--texto-primario); line-height: 1.25; }

.slide-cards .card-desc { font-size: 14px; color: var(--texto-secundario); line-height: 1.45; }

.slide-cards .num-slide { color: var(--texto-secundario); }

/* ============================================================
   TIPO: fluxo (chevrons)
   ============================================================ */
.slide-fluxo { background: #fff; }

.slide-fluxo .corpo { flex: 1; padding: 28px 52px 56px; display: flex; flex-direction: column; gap: 20px; }

.slide-fluxo .chevrons { display: flex; align-items: stretch; gap: 0; height: 76px; }

.slide-fluxo .chevron {
  position: relative; display: flex; align-items: center; justify-content: center;
  flex: 1; color: #fff; font-family: 'Poppins', sans-serif;
  font-size: 24px; font-weight: 800;
  clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 50%, calc(100% - 22px) 100%, 0 100%, 22px 50%);
  padding: 0 28px;
}

.slide-fluxo .chevron:first-child { clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 50%, calc(100% - 22px) 100%, 0 100%); }
.slide-fluxo .chevron:last-child  { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 22px 50%); }
.slide-fluxo .chevron:first-child:last-child { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }

.slide-fluxo .chevron:nth-child(1) { background: var(--accent-orange); }
.slide-fluxo .chevron:nth-child(2) { background: color-mix(in srgb, var(--accent-orange) 50%, var(--accent) 50%); }
.slide-fluxo .chevron:nth-child(3) { background: var(--accent); }
.slide-fluxo .chevron:nth-child(4) { background: color-mix(in srgb, var(--accent) 50%, var(--accent2) 50%); }
.slide-fluxo .chevron:nth-child(5) { background: var(--accent2); }
.slide-fluxo .chevron:nth-child(6) { background: color-mix(in srgb, var(--accent2) 70%, #000 30%); }

.slide-fluxo .descricoes { display: flex; gap: 0; }

.slide-fluxo .desc-item { flex: 1; padding: 0 10px; display: flex; flex-direction: column; gap: 4px; }

.slide-fluxo .desc-titulo { font-size: 15px; font-weight: 700; color: var(--texto-primario); line-height: 1.2; }

.slide-fluxo .desc-sub { font-size: 12px; color: var(--texto-secundario); line-height: 1.35; }

.slide-fluxo .metricas-row { display: flex; gap: 16px; margin-top: 4px; }

.slide-fluxo .metrica-card { flex: 1; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: var(--radius); padding: 14px 18px; display: flex; flex-direction: column; gap: 4px; }

.slide-fluxo .metrica-valor { font-family: 'Poppins', sans-serif; font-size: 30px; font-weight: 800; line-height: 1; }

.slide-fluxo .metrica-card:nth-child(1) .metrica-valor { color: var(--accent-orange); }
.slide-fluxo .metrica-card:nth-child(2) .metrica-valor { color: var(--accent); }
.slide-fluxo .metrica-card:nth-child(3) .metrica-valor { color: var(--accent2); }
.slide-fluxo .metrica-card:nth-child(4) .metrica-valor { color: color-mix(in srgb, var(--accent2) 70%, #000 30%); }

.slide-fluxo .metrica-label { font-size: 12px; color: var(--texto-secundario); line-height: 1.3; }
.slide-fluxo .num-slide { color: var(--texto-secundario); }

/* ============================================================
   TIPO: metricas (números grandes)
   ============================================================ */
.slide-metricas { background: #fff; }

.slide-metricas .corpo { flex: 1; padding: 28px 52px 56px; display: flex; flex-direction: column; gap: 20px; }

.slide-metricas .grid-metricas { display: grid; gap: 18px; flex: 1; }
.slide-metricas .grid-metricas.cols-2 { grid-template-columns: repeat(2,1fr); }
.slide-metricas .grid-metricas.cols-3 { grid-template-columns: repeat(3,1fr); }
.slide-metricas .grid-metricas.cols-4 { grid-template-columns: repeat(4,1fr); }

.slide-metricas .metrica {
  background: #F8FAFC; border: 1px solid #E2E8F0;
  border-radius: var(--radius); padding: 24px 24px 20px;
  display: flex; flex-direction: column; gap: 8px;
  position: relative; overflow: hidden;
}

.slide-metricas .metrica::before { content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 4px; }
.slide-metricas .metrica:nth-child(1)::before { background: var(--accent-orange); }
.slide-metricas .metrica:nth-child(2)::before { background: var(--accent); }
.slide-metricas .metrica:nth-child(3)::before { background: var(--accent2); }
.slide-metricas .metrica:nth-child(4)::before { background: color-mix(in srgb, var(--accent2) 70%, #000 30%); }

.slide-metricas .metrica-num { font-family: 'Poppins', sans-serif; font-size: 56px; font-weight: 900; line-height: 1; }
.slide-metricas .metrica:nth-child(1) .metrica-num { color: var(--accent-orange); }
.slide-metricas .metrica:nth-child(2) .metrica-num { color: var(--accent); }
.slide-metricas .metrica:nth-child(3) .metrica-num { color: var(--accent2); }
.slide-metricas .metrica:nth-child(4) .metrica-num { color: color-mix(in srgb, var(--accent2) 70%, #000 30%); }

.slide-metricas .metrica-titulo { font-size: 17px; font-weight: 700; color: var(--texto-primario); }
.slide-metricas .metrica-desc   { font-size: 14px; color: var(--texto-secundario); line-height: 1.4; }
.slide-metricas .metrica-fonte  { font-size: 11px; color: var(--texto-secundario); opacity: 0.7; margin-top: 4px; font-style: italic; }
.slide-metricas .num-slide { color: var(--texto-secundario); }

/* ============================================================
   TIPO: hub (diagrama radial com centro e satélites)
   ============================================================ */
.slide-hub { background: #fff; }

.slide-hub .topo {
  padding: 24px 64px 0;
  flex-shrink: 0;
}

.slide-hub .topo h2 {
  font-family: 'Poppins', sans-serif; font-size: 36px; font-weight: 800;
  color: var(--accent); text-transform: uppercase; letter-spacing: 0.3px;
}

.slide-hub .canvas {
  flex: 1;
  position: relative;
}

/* Centro do hub */
.slide-hub .hub-centro {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 140px; height: 140px;
  border-radius: 50%;
  background: var(--fundo-escuro);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 10;
  box-shadow: 0 8px 32px rgba(0,0,0,0.22);
}

.slide-hub .hub-centro-titulo {
  font-family: 'Poppins', sans-serif;
  font-size: 20px; font-weight: 800; color: #fff; letter-spacing: 0.5px;
}

.slide-hub .hub-centro-sub {
  font-size: 11px; color: rgba(255,255,255,0.65); text-align: center; padding: 0 10px;
}

/* Satélites — posicionados por CSS absolute com variáveis de posição */
.slide-hub .satelite {
  position: absolute;
  display: flex; align-items: center; gap: 12px;
}

/* Linha conectora (SVG inline) */
.slide-hub .hub-linhas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 1;
}

/* Bolinha do satélite */
.slide-hub .sat-icone {
  width: 52px; height: 52px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.slide-hub .sat-icone img { width: 28px; height: 28px; object-fit: contain; }

/* Cores dos satélites por ordem */
.slide-hub .satelite:nth-child(1) .sat-icone { background: var(--accent-orange); }
.slide-hub .satelite:nth-child(2) .sat-icone { background: color-mix(in srgb, var(--accent-orange) 60%, var(--accent) 40%); }
.slide-hub .satelite:nth-child(3) .sat-icone { background: var(--accent); }
.slide-hub .satelite:nth-child(4) .sat-icone { background: color-mix(in srgb, var(--accent) 50%, var(--accent2) 50%); }
.slide-hub .satelite:nth-child(5) .sat-icone { background: var(--accent2); }
.slide-hub .satelite:nth-child(6) .sat-icone { background: color-mix(in srgb, var(--accent2) 70%, #000 30%); }

.slide-hub .sat-info { display: flex; flex-direction: column; gap: 2px; }

.slide-hub .sat-nome {
  font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 700;
  line-height: 1.2;
}

/* Cor do nome igual ao satélite */
.slide-hub .satelite:nth-child(1) .sat-nome { color: var(--accent-orange); }
.slide-hub .satelite:nth-child(2) .sat-nome { color: color-mix(in srgb, var(--accent-orange) 60%, var(--accent) 40%); }
.slide-hub .satelite:nth-child(3) .sat-nome { color: var(--accent); }
.slide-hub .satelite:nth-child(4) .sat-nome { color: color-mix(in srgb, var(--accent) 50%, var(--accent2) 50%); }
.slide-hub .satelite:nth-child(5) .sat-nome { color: var(--accent2); }
.slide-hub .satelite:nth-child(6) .sat-nome { color: color-mix(in srgb, var(--accent2) 70%, #000 30%); }

.slide-hub .sat-desc { font-size: 12px; color: var(--texto-secundario); line-height: 1.3; max-width: 180px; }

.slide-hub .num-slide { color: var(--texto-secundario); }

/* ============================================================
   TIPO: split (código/imagem à esquerda + lista à direita)
   ============================================================ */
.slide-split { background: #fff; }

.slide-split .corpo {
  flex: 1; display: grid; grid-template-columns: 1fr 1fr;
  gap: 0; padding: 24px 0 56px; align-items: start;
}

.slide-split .lado-esq {
  padding: 0 28px 0 64px;
  display: flex; flex-direction: column; gap: 14px;
}

.slide-split .lado-dir {
  padding: 0 64px 0 28px;
  border-left: 1px solid #E2E8F0;
  display: flex; flex-direction: column; gap: 14px;
}

/* Label de contexto (ex: ".kiro/settings/mcp.json") */
.slide-split .label-contexto {
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  color: var(--texto-secundario); background: #F1F5F9;
  padding: 4px 12px; border-radius: 4px; display: inline-block;
}

/* Bloco de código */
.slide-split .bloco-codigo {
  background: #111827; border-radius: var(--radius);
  padding: 20px 22px; font-family: 'JetBrains Mono', monospace;
  font-size: 13px; line-height: 1.65; color: #e2e8f0;
  white-space: pre; overflow: hidden;
  border: 1px solid #1F2937;
}

/* Card de destaque (ex: "Sem conta AWS: ...") */
.slide-split .card-destaque {
  background: #F8FAFC; border: 1px solid #E2E8F0;
  border-radius: var(--radius); padding: 14px 16px;
  display: flex; align-items: flex-start; gap: 12px;
}

.slide-split .card-destaque .icone-badge {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--badge-bg);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.slide-split .card-destaque .icone-badge img { width: 20px; height: 20px; object-fit: contain; }

.slide-split .card-destaque-txt { font-size: 13px; color: var(--texto-primario); line-height: 1.45; }
.slide-split .card-destaque-txt strong { font-weight: 700; color: var(--accent); }

/* Itens da lista direita */
.slide-split .split-item {
  display: flex; align-items: flex-start; gap: 14px;
  padding-bottom: 14px;
  border-bottom: 1px solid #F1F5F9;
}

.slide-split .split-item:last-child { border-bottom: none; }

.slide-split .split-icone {
  width: 44px; height: 44px; border-radius: 50%;
  background: color-mix(in srgb, var(--accent) 10%, white);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

/* Cor alternada dos ícones circulares */
.slide-split .split-item:nth-child(1) .split-icone { background: color-mix(in srgb, var(--accent-orange) 12%, white); }
.slide-split .split-item:nth-child(2) .split-icone { background: color-mix(in srgb, var(--accent) 12%, white); }
.slide-split .split-item:nth-child(3) .split-icone { background: color-mix(in srgb, var(--accent2) 12%, white); }
.slide-split .split-item:nth-child(4) .split-icone { background: color-mix(in srgb, var(--accent-orange) 12%, white); }

.slide-split .split-icone img { width: 22px; height: 22px; object-fit: contain; }

.slide-split .split-texto { display: flex; flex-direction: column; gap: 3px; }

.slide-split .split-titulo {
  font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 700;
  letter-spacing: 0.5px; text-transform: uppercase;
}

.slide-split .split-item:nth-child(1) .split-titulo { color: var(--accent-orange); }
.slide-split .split-item:nth-child(2) .split-titulo { color: var(--accent); }
.slide-split .split-item:nth-child(3) .split-titulo { color: var(--accent2); }
.slide-split .split-item:nth-child(4) .split-titulo { color: var(--accent-orange); }

.slide-split .split-desc { font-size: 16px; color: var(--texto-primario); line-height: 1.35; }

.slide-split .num-slide { color: var(--texto-secundario); }

/* ============================================================
   TIPO: pipeline (fluxo horizontal numerado + legenda no rodapé)
   ============================================================ */
.slide-pipeline { background: #fff; }

.slide-pipeline .topo {
  padding: 20px 64px 0; flex-shrink: 0;
}

.slide-pipeline .topo h2 {
  font-family: 'Poppins', sans-serif; font-size: 36px; font-weight: 800;
  color: var(--texto-primario); text-transform: uppercase;
}

.slide-pipeline .area-diagrama {
  flex: 1; padding: 16px 52px 0;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}

/* Caixa de diagrama (área de rascunho visual) */
.slide-pipeline .diagrama-box {
  width: 100%; background: #FAFAFA;
  border: 1.5px dashed #CBD5E1; border-radius: var(--radius-lg);
  padding: 20px 24px;
  display: flex; flex-direction: column; gap: 12px;
}

/* Linha do pipeline */
.slide-pipeline .pipe-row {
  display: flex; align-items: center; gap: 0;
}

.slide-pipeline .pipe-node {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  flex: 1;
}

.slide-pipeline .pipe-box {
  padding: 8px 14px; border-radius: var(--radius);
  font-size: 13px; font-weight: 600; text-align: center;
  border: 1.5px solid var(--border-card); background: white;
  color: var(--texto-primario); line-height: 1.3;
  min-width: 100px;
}

/* Marcadores numerados nas setas */
.slide-pipeline .pipe-arrow {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 0 4px;
}

.slide-pipeline .pipe-num {
  width: 20px; height: 20px; border-radius: 50%;
  font-size: 11px; font-weight: 700; color: #fff;
  display: flex; align-items: center; justify-content: center;
}

.slide-pipeline .pipe-num:nth-child(1) { background: var(--accent-orange); }

.slide-pipeline .pipe-line {
  width: 32px; height: 2px; background: var(--border-card);
}

.slide-pipeline .pipe-label { font-size: 10px; color: var(--texto-secundario); }

/* Legenda rodapé do pipeline */
