<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">

<style>
/* ============================================================
   DESIGN TOKENS — injetados pelo Python
   ============================================================ */
:root {
  --fundo-escuro:     {{ FUNDO_ESCURO }};
  --fundo-claro:      {{ FUNDO_CLARO }};
  --surface-card:     {{ SURFACE_CARD }};
  --border-card:      {{ BORDER_CARD }};
  --texto-primario:   {{ TEXTO_PRIMARIO }};
  --texto-secundario: {{ TEXTO_SECUNDARIO }};
  --texto-claro:      {{ TEXTO_CLARO }};
  --accent:           {{ ACCENT }};
  --accent2:          {{ ACCENT2 }};
  --accent-orange:    {{ ACCENT_ORANGE }};
  --badge-bg:         {{ BADGE_BG }};
  --badge-text:       {{ BADGE_TEXT }};
  --fonte-titulo:     {{ FONTE_TITULO }};
  --fonte-corpo:      {{ FONTE_CORPO }};
  --padding-slide:    {{ PADDING_SLIDE }};
  --radius:           {{ BORDER_RADIUS }};
  --radius-lg:        {{ BORDER_RADIUS_LG }};

  /* Gradiente principal (capa + linha base) */
  --grad-main: linear-gradient(135deg, var(--accent-orange) 0%, var(--accent) 50%, var(--accent2) 100%);
  --grad-line: linear-gradient(90deg, var(--accent-orange), var(--accent), var(--accent2));
}

/* ============================================================
   RESET
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  width: 1280px;
  height: 720px;
  overflow: hidden;
  font-family: 'Inter', var(--fonte-corpo), 'Segoe UI', sans-serif;
  background: var(--fundo-claro);
  -webkit-font-smoothing: antialiased;
}

.slide {
  width: 1280px;
  height: 720px;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ============================================================
   COMPONENTE: Branding duplo (topo direito)
   Renderiza <LAB365>  SENAI
   ============================================================ */
.branding-duplo {
  position: absolute;
  top: 22px;
  right: 52px;
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 30;
}

.brand-lab {
  font-family: 'Poppins', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--texto-secundario);
}

.brand-lab span { color: var(--accent); }

.brand-senai {
  background: var(--accent2);
  color: #fff;
  font-family: 'Poppins', sans-serif;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.5px;
  padding: 4px 10px;
  border-radius: 4px;
}

/* Branding claro (sobre fundos escuros) */
.branding-duplo.claro .brand-lab { color: rgba(255,255,255,0.7); }
.branding-duplo.claro .brand-lab span { color: var(--accent-orange); }
.branding-duplo.claro .brand-senai { background: rgba(255,255,255,0.18); color: #fff; }

/* ============================================================
   COMPONENTE: Eyebrow
   ============================================================ */
.eyebrow {
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 6px;
}

/* ============================================================
   COMPONENTE: Linha gradiente base
   ============================================================ */
.linha-base {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 5px;
  background: var(--grad-line);
}

/* ============================================================
   COMPONENTE: Numeração
   ============================================================ */
.num-slide {
  position: absolute;
  bottom: 14px;
  right: 52px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  opacity: 0.35;
  z-index: 20;
  font-family: 'Inter', sans-serif;
}

/* ============================================================
   TIPO: capa  (gradiente laranja→roxo→azul)
   ============================================================ */
.slide-capa {
  background: var(--grad-main);
  justify-content: center;
  align-items: flex-start;
}

.slide-capa .corpo {
  padding: 0 72px;
  position: relative;
  z-index: 2;
  max-width: 820px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.slide-capa .eyebrow { color: rgba(255,255,255,0.75); letter-spacing: 2.5px; }

.slide-capa h1 {
  font-family: 'Poppins', sans-serif;
  font-size: 64px;
  font-weight: 800;
  color: #fff;
  line-height: 1.0;
  letter-spacing: -1px;
  text-transform: uppercase;
  text-shadow: 0 3px 24px rgba(0,0,0,0.25);
}

.slide-capa .subtitulo {
  font-size: 22px;
  color: rgba(255,255,255,0.85);
  font-weight: 400;
  line-height: 1.45;
  max-width: 640px;
}

.slide-capa .num-slide { color: rgba(255,255,255,0.45); }

/* ============================================================
   TIPO: bullets
   ============================================================ */
.slide-bullets { background: #fff; }

.slide-bullets .header {
  background: var(--fundo-escuro);
  padding: 0 64px;
  height: 106px;
  display: flex;
  align-items: center;
  gap: 18px;
  flex-shrink: 0;
}

.slide-bullets .header h2 {
  font-family: 'Poppins', sans-serif;
  font-size: 34px;
  font-weight: 700;
  color: #fff;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.slide-bullets .header-icone {
  width: 48px; height: 48px;
  object-fit: contain; flex-shrink: 0;
}

.slide-bullets .corpo {
  padding: 28px 64px 56px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.slide-bullets .bullet {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 13px 20px;
  background: #F8FAFC;
  border: 1px solid #E2E8F0;
  border-radius: var(--radius);
  border-left: 4px solid var(--accent);
}

.slide-bullets .bullet-num {
  min-width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 2px;
}

.slide-bullets .bullet-texto {
  font-size: 21px; color: var(--texto-primario);
  line-height: 1.35; font-weight: 400;
}

.slide-bullets .bullet-texto strong { font-weight: 700; color: var(--accent); }
.slide-bullets .num-slide { color: var(--texto-secundario); }

/* ============================================================
   TIPO: cards (grid 2–4 colunas)
   ============================================================ */
.slide-cards { background: #fff; }

.slide-cards .header {
  background: var(--fundo-escuro);
  padding: 0 64px; height: 106px;
  display: flex; align-items: center;
  flex-shrink: 0;
}

.slide-cards .header h2 {
  font-family: 'Poppins', sans-serif;
  font-size: 34px; font-weight: 700;
  color: #fff; text-transform: uppercase;
}

.slide-cards .grid {
  padding: 24px 52px 56px;
  flex: 1; display: grid; gap: 18px; align-items: stretch;
}

.slide-cards .grid.cols-2 { grid-template-columns: repeat(2,1fr); }
.slide-cards .grid.cols-3 { grid-template-columns: repeat(3,1fr); }
.slide-cards .grid.cols-4 { grid-template-columns: repeat(4,1fr); }

.slide-cards .card-item {
  background: #F8FAFC;
  border: 1px solid #E2E8F0;
  border-radius: var(--radius);
  padding: 22px 20px 18px;
  display: flex; flex-direction: column; gap: 10px;
  position: relative; overflow: hidden;
}

.slide-cards .card-item::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--grad-line);
}

.slide-cards .card-num {
  width: 34px; height: 34px; border-radius: 8px;
  background: var(--badge-bg); color: var(--badge-text);
  font-size: 15px; font-weight: 800;
  font-family: 'Poppins', sans-serif;
  display: flex; align-items: center; justify-content: center;
}

.slide-cards .card-icone { width: 38px; height: 38px; object-fit: contain; }

.slide-cards .card-titulo {
  font-size: 16px; font-weight: 700;
  color: var(--texto-primario); line-height: 1.25;
}

.slide-cards .card-desc {
  font-size: 13px; color: var(--texto-secundario); line-height: 1.45;
}

.slide-cards .num-slide { color: var(--texto-secundario); }

/* ============================================================
   TIPO: fluxo  (chevrons coloridos tipo pipeline)
   ============================================================ */
.slide-fluxo { background: #fff; }

.slide-fluxo .header {
  background: var(--fundo-escuro);
  padding: 0 64px; height: 106px;
  display: flex; align-items: center; flex-shrink: 0;
}

.slide-fluxo .header h2 {
  font-family: 'Poppins', sans-serif;
  font-size: 34px; font-weight: 700;
  color: #fff; text-transform: uppercase;
}

.slide-fluxo .corpo {
  flex: 1; padding: 32px 52px 56px;
  display: flex; flex-direction: column; gap: 24px;
}

/* Faixa de etapas em chevron */
.slide-fluxo .chevrons {
  display: flex; align-items: stretch;
  gap: 0; height: 72px;
}

.slide-fluxo .chevron {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  flex: 1;
  color: #fff;
  font-family: 'Poppins', sans-serif;
  font-size: 22px; font-weight: 800;
  cursor: default;
  clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 0 100%, 20px 50%);
  padding: 0 28px;
}

/* Primeiro chevron — sem recorte à esquerda */
.slide-fluxo .chevron:first-child {
  clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 0 100%);
}

/* Último chevron — sem ponta à direita */
.slide-fluxo .chevron:last-child {
  clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 20px 50%);
}

/* Só 1 chevron */
.slide-fluxo .chevron:first-child:last-child {
  clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
}

/* Cores por posição (até 6) */
.slide-fluxo .chevron:nth-child(1) { background: var(--accent-orange); }
.slide-fluxo .chevron:nth-child(2) { background: color-mix(in srgb, var(--accent-orange) 50%, var(--accent) 50%); }
.slide-fluxo .chevron:nth-child(3) { background: var(--accent); }
.slide-fluxo .chevron:nth-child(4) { background: color-mix(in srgb, var(--accent) 50%, var(--accent2) 50%); }
.slide-fluxo .chevron:nth-child(5) { background: var(--accent2); }
.slide-fluxo .chevron:nth-child(6) { background: color-mix(in srgb, var(--accent2) 70%, #000 30%); }

/* Descrições abaixo dos chevrons */
.slide-fluxo .descricoes {
  display: flex; gap: 0;
}

.slide-fluxo .desc-item {
  flex: 1; padding: 0 10px;
  display: flex; flex-direction: column; gap: 4px;
}

.slide-fluxo .desc-titulo {
  font-size: 15px; font-weight: 700;
  color: var(--texto-primario); line-height: 1.2;
}

.slide-fluxo .desc-sub {
  font-size: 12px; color: var(--texto-secundario);
  line-height: 1.35;
}

/* Cards de métricas opcionais abaixo */
.slide-fluxo .metricas-row {
  display: flex; gap: 16px; margin-top: 4px;
}

.slide-fluxo .metrica-card {
  flex: 1;
  background: #F8FAFC;
  border: 1px solid #E2E8F0;
  border-radius: var(--radius);
  padding: 14px 18px;
  display: flex; flex-direction: column; gap: 4px;
}

.slide-fluxo .metrica-valor {
  font-family: 'Poppins', sans-serif;
  font-size: 28px; font-weight: 800;
  line-height: 1;
}

.slide-fluxo .metrica-card:nth-child(1) .metrica-valor { color: var(--accent-orange); }
.slide-fluxo .metrica-card:nth-child(2) .metrica-valor { color: var(--accent); }
.slide-fluxo .metrica-card:nth-child(3) .metrica-valor { color: var(--accent2); }
.slide-fluxo .metrica-card:nth-child(4) .metrica-valor { color: color-mix(in srgb, var(--accent2) 70%, #000 30%); }

.slide-fluxo .metrica-label {
  font-size: 12px; color: var(--texto-secundario); line-height: 1.3;
}

.slide-fluxo .num-slide { color: var(--texto-secundario); }

/* ============================================================
   TIPO: metricas (números grandes em destaque)
   ============================================================ */
.slide-metricas { background: #fff; }

.slide-metricas .header {
  background: var(--fundo-escuro);
  padding: 0 64px; height: 106px;
  display: flex; align-items: center; flex-shrink: 0;
}

.slide-metricas .header h2 {
  font-family: 'Poppins', sans-serif;
  font-size: 34px; font-weight: 700;
  color: #fff; text-transform: uppercase;
}

.slide-metricas .corpo {
  flex: 1; padding: 32px 52px 56px;
  display: flex; flex-direction: column; gap: 20px;
}

.slide-metricas .grid-metricas {
  display: grid; gap: 18px; flex: 1;
}

.slide-metricas .grid-metricas.cols-2 { grid-template-columns: repeat(2,1fr); }
.slide-metricas .grid-metricas.cols-3 { grid-template-columns: repeat(3,1fr); }
.slide-metricas .grid-metricas.cols-4 { grid-template-columns: repeat(4,1fr); }

.slide-metricas .metrica {
  background: #F8FAFC;
  border: 1px solid #E2E8F0;
  border-radius: var(--radius);
  padding: 24px 24px 20px;
  display: flex; flex-direction: column; gap: 8px;
  position: relative; overflow: hidden;
}

.slide-metricas .metrica::before {
  content: '';
  position: absolute; top: 0; left: 0; bottom: 0; width: 4px;
}

.slide-metricas .metrica:nth-child(1)::before { background: var(--accent-orange); }
.slide-metricas .metrica:nth-child(2)::before { background: var(--accent); }
.slide-metricas .metrica:nth-child(3)::before { background: var(--accent2); }
.slide-metricas .metrica:nth-child(4)::before { background: color-mix(in srgb, var(--accent2) 70%, #000 30%); }

.slide-metricas .metrica-num {
  font-family: 'Poppins', sans-serif;
  font-size: 52px; font-weight: 900; line-height: 1;
}

.slide-metricas .metrica:nth-child(1) .metrica-num { color: var(--accent-orange); }
.slide-metricas .metrica:nth-child(2) .metrica-num { color: var(--accent); }
.slide-metricas .metrica:nth-child(3) .metrica-num { color: var(--accent2); }
.slide-metricas .metrica:nth-child(4) .metrica-num { color: color-mix(in srgb, var(--accent2) 70%, #000 30%); }

.slide-metricas .metrica-titulo {
  font-size: 16px; font-weight: 700; color: var(--texto-primario);
}

.slide-metricas .metrica-desc {
  font-size: 13px; color: var(--texto-secundario); line-height: 1.4;
}

.slide-metricas .metrica-fonte {
  font-size: 10px; color: var(--texto-secundario);
  opacity: 0.7; margin-top: 4px;
  font-style: italic;
}

.slide-metricas .num-slide { color: var(--texto-secundario); }

/* ============================================================
   TIPO: diagrama
   ============================================================ */
.slide-diagrama { background: #fff; }

.slide-diagrama .header {
  background: var(--fundo-escuro);
  padding: 0 64px; height: 106px;
  display: flex; align-items: center; flex-shrink: 0;
}

.slide-diagrama .header h2 {
  font-family: 'Poppins', sans-serif;
  font-size: 34px; font-weight: 700;
  color: #fff; text-transform: uppercase;
}

.slide-diagrama .corpo {
  flex: 1; display: flex;
  align-items: center; gap: 48px;
  padding: 28px 64px 56px;
}

.slide-diagrama .icone-hero {
  width: 220px; flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}

.slide-diagrama .icone-bg {
  width: 170px; height: 170px;
  border-radius: var(--radius-lg);
  background: var(--badge-bg);
  border: 2px solid var(--border-card);
  display: flex; align-items: center; justify-content: center;
}

.slide-diagrama .icone-bg img { width: 100px; height: 100px; object-fit: contain; }

.slide-diagrama .icone-label {
  font-size: 12px; font-weight: 700;
  color: var(--texto-secundario); text-align: center; letter-spacing: 0.5px;
}

.slide-diagrama .topicos {
  flex: 1; display: flex; flex-direction: column; gap: 13px;
}

.slide-diagrama .topico {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 13px 18px;
  background: #F8FAFC;
  border: 1px solid #E2E8F0;
  border-radius: var(--radius);
  border-left: 4px solid var(--accent);
  font-size: 19px; color: var(--texto-primario); line-height: 1.35;
}

.slide-diagrama .sem-icone .topicos { max-width: 880px; margin: auto; }
.slide-diagrama .num-slide { color: var(--texto-secundario); }

/* ============================================================
   TIPO: comparacao
   ============================================================ */
.slide-comparacao { background: #fff; }

.slide-comparacao .header {
  background: var(--fundo-escuro);
  padding: 0 64px; height: 106px;
  display: flex; align-items: center; flex-shrink: 0;
}

.slide-comparacao .header h2 {
  font-family: 'Poppins', sans-serif;
  font-size: 34px; font-weight: 700;
  color: #fff; text-transform: uppercase;
}

.slide-comparacao .corpo {
  flex: 1; display: grid;
  grid-template-columns: 1fr 2px 1fr;
  padding: 24px 52px 56px; gap: 0;
}

.slide-comparacao .divisor-v {
  background: var(--grad-line);
  align-self: stretch; border-radius: 2px; margin: 0 8px;
}

.slide-comparacao .coluna { padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }

.slide-comparacao .col-label {
  font-family: 'Poppins', sans-serif;
  font-size: 12px; font-weight: 800;
  letter-spacing: 2px; text-transform: uppercase;
  padding: 6px 14px; border-radius: var(--radius);
  margin-bottom: 6px; display: inline-block;
}

.slide-comparacao .coluna-esq .col-label {
  background: color-mix(in srgb, var(--accent2) 12%, transparent);
  color: var(--accent2);
}

.slide-comparacao .coluna-dir .col-label {
  background: color-mix(in srgb, var(--accent) 12%, transparent);
  color: var(--accent);
}

.slide-comparacao .comp-item {
  padding: 10px 16px;
  background: #F8FAFC; border: 1px solid #E2E8F0;
  border-radius: var(--radius);
  font-size: 18px; color: var(--texto-primario); line-height: 1.3;
}

.slide-comparacao .num-slide { color: var(--texto-secundario); }

/* ============================================================
   TIPO: agenda
   ============================================================ */
.slide-agenda { background: #fff; }

.slide-agenda .header {
  background: var(--fundo-escuro);
  padding: 0 64px; height: 106px;
  display: flex; align-items: center; flex-shrink: 0;
}

.slide-agenda .header h2 {
  font-family: 'Poppins', sans-serif;
  font-size: 34px; font-weight: 700;
  color: #fff; text-transform: uppercase;
}

.slide-agenda .corpo {
  padding: 26px 64px 56px; flex: 1;
  display: flex; flex-direction: column; gap: 10px;
}

.slide-agenda .linha-agenda {
  display: grid; grid-template-columns: 190px 1fr;
  gap: 14px; align-items: center;
}

.slide-agenda .etapa-badge {
  display: flex; align-items: center; justify-content: center;
  padding: 10px 14px;
  border-radius: var(--radius);
  background: var(--badge-bg); color: var(--badge-text);
  font-size: 12px; font-weight: 700; text-align: center; line-height: 1.3;
}

.slide-agenda .descricao {
  padding: 12px 20px;
  background: #F8FAFC; border: 1px solid #E2E8F0;
  border-radius: var(--radius);
  border-left: 4px solid var(--accent);
  font-size: 18px; color: var(--texto-primario); line-height: 1.3;
}

.slide-agenda .num-slide { color: var(--texto-secundario); }

/* ============================================================
   TIPO: encerramento (gradiente, estilo capa)
   ============================================================ */
.slide-encerramento {
  background: var(--grad-main);
  align-items: center; justify-content: center; text-align: center;
}

.slide-encerramento .corpo {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center; gap: 22px;
  padding: 64px;
}

.slide-encerramento h1 {
  font-family: 'Poppins', sans-serif;
  font-size: 60px; font-weight: 800; color: #fff;
  line-height: 1.0; letter-spacing: -1px; text-transform: uppercase;
  text-shadow: 0 3px 20px rgba(0,0,0,0.2);
}

.slide-encerramento .linha-dec {
  width: 80px; height: 4px;
  background: rgba(255,255,255,0.6); border-radius: 2px;
}

.slide-encerramento .frase {
  font-size: 22px; color: rgba(255,255,255,0.85);
  max-width: 700px; line-height: 1.5; font-style: italic;
}

.slide-encerramento .num-slide { color: rgba(255,255,255,0.4); }

</style>
</head>
<body>
{{ CONTEUDO_SLIDE }}
</body>
</html>
